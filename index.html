<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10231f"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><title>KlusFix</title></head><body><header><h1>KlusFix</h1><button id="logout" hidden>Uitloggen</button></header><main><p id="notice" role="status"></p><section id="auth" class="screen active"><h2 id="authTitle">Inloggen</h2><form id="authForm"><label>E-mailadres<input id="email" type="email" autocomplete="email" required></label><label>Wachtwoord<input id="password" type="password" minlength="10" autocomplete="current-password" required></label><div class="registerOnly" hidden><label>Naam<input id="name" autocomplete="name"></label><label>Type account<select id="role"><option value="consument">Consument</option><option value="vakman">Vakman</option></select></label><div id="tradeFields" hidden><label>Vakgebied<select id="trade"></select></label><label>Werkpostcode<input id="workPostcode"></label></div></div><button id="authSubmit" class="primary" type="submit">Inloggen</button></form><button id="authSwitch">Nog geen account? Registreren</button></section><section id="home" class="screen"><h2 id="welcome"></h2><button id="newBtn" class="primary">Nieuwe melding</button><h3>Mijn meldingen</h3><div id="cases"></div><h3>Mijn aanvragen</h3><div id="myRequests"></div><h3>Mijn offertes</h3><div id="myQuotes"></div></section><section id="report" class="screen"><h2>Nieuwe melding</h2><h3>Categorie</h3><div id="categories" class="categories"></div><label>Omschrijving<textarea id="description" rows="5"></textarea></label><label>Postcode<input id="postcode"></label><label>Foto (max. 3 MB)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="preview"></div><label class="check"><input id="aiConsent" type="checkbox"> Ik geef toestemming om mijn foto voor AI-analyse te versturen.</label><button id="analyzeBtn" class="primary">Analyseer probleem →</button><button data-go="home">Terug</button></section><section id="analysis" class="screen"><h2>Analyse</h2><div id="result"></div><button id="saveBtn" class="primary">Melding opslaan en vakman zoeken</button><button data-go="home">Terug</button></section><section id="match" class="screen"><h2>Passende vakmannen</h2><div id="trades"></div><button data-go="home">Terug naar overzicht</button></section><section id="pro" class="screen"><h2 id="proWelcome"></h2><h3>Aanvragen</h3><div id="leads"></div><h3>Mijn offertes</h3><div id="proQuotes"></div></section></main><script src="/app.js" defer></script></body></html>
