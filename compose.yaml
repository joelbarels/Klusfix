services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: /data/klusfix.sqlite
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - klusfix_data:/data
    networks: [private]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      TEST_USER: ${TEST_USER:?Set TEST_USER in .env}
      TEST_PASSWORD_HASH: ${TEST_PASSWORD_HASH:?Set TEST_PASSWORD_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [private]
networks:
  private:
volumes:
  klusfix_data:
  caddy_data:
  caddy_config:
